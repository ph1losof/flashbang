[install]
dev = true
peer = false
production = false
#
[install.lockfile]
save = true

[test]
preload = ["./tests/helpers/preload.ts"]
coveragePathIgnorePatterns = [
  "scripts/**",
  "tests/**",
  "src/generated/**",
  # Browser UI is covered by the Playwright suite, not by `bun test`.
  "src/ui/**",
  "*.config.ts",
]
coverageThreshold = { lines = 0.97, functions = 0.9 }
