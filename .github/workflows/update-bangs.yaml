name: Update Bangs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-bangs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch and generate bangs
        run: bun run codegen

      - name: Check for changes
        id: diff
        run: |
          git add data/bangs.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize changes
        if: steps.diff.outputs.changed == 'true'
        env:
          PR_BODY: ${{ runner.temp }}/update-bangs-pr.md
          PREVIOUS_BANGS: ${{ runner.temp }}/previous-bangs.json
        run: |
          git show HEAD:data/bangs.json > "$PREVIOUS_BANGS"
          bun scripts/summarize-bang-update.ts \
            "$PREVIOUS_BANGS" data/bangs.json > "$PR_BODY"

      - name: Install Playwright browsers
        if: steps.diff.outputs.changed == 'true'
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Verify update
        if: steps.diff.outputs.changed == 'true'
        run: |
          bun run typecheck
          bun run check
          bun audit
          bun test
          bun run build
          bun run test:e2e

      - name: Commit update
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Codegen appends any new strings to the append-only ID map. Leaving
          # those edits behind makes the committed map lag data/bangs.json, so
          # every later codegen run re-appends them and dirties the tree.
          git add data/bang-prefixes.txt data/bang-suffixes.txt \
            data/bang-strings-meta.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update bangs"

      - name: Push update branch and open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ runner.temp }}/update-bangs-pr.md
        run: |
          set -euo pipefail
          branch="automation/update-bangs"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          gh auth setup-git
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
              --base master \
              --title "chore: update bangs" \
              --body-file "$PR_BODY"
          else
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head "$branch" \
              --title "chore: update bangs" \
              --body-file "$PR_BODY")"
          fi

          gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --delete-branch \
            --match-head-commit "$(git rev-parse HEAD)"
