name: Update Bangs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-bangs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch and generate bangs
        run: bun run codegen

      - name: Check for changes
        id: diff
        run: |
          git add data/bangs.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright browsers
        if: steps.diff.outputs.changed == 'true'
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Verify update
        if: steps.diff.outputs.changed == 'true'
        run: |
          bun run typecheck
          bun run check
          bun audit
          bun test
          bun run build
          bun run test:e2e

      - name: Commit update
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update bangs"

      - name: Push update branch and open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/update-bangs"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          gh auth setup-git
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
              --base master \
              --title "chore: update bangs" \
              --body "Automated daily update of the merged DuckDuckGo and Kagi bang data."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head "$branch" \
              --title "chore: update bangs" \
              --body "Automated daily update of the merged DuckDuckGo and Kagi bang data."
          fi

          gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$branch"
