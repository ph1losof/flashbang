name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run codegen -- --from-merged
      - run: bun run typecheck
      - run: bun run check
      - run: bun audit
      - run: bun test
      - run: bun run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run test:e2e -- --project=${{ matrix.browser }}

  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for Docker-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_sha="$BASE_SHA"
          head_sha="$HEAD_SHA"
          if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
            git fetch origin master
            base_sha="$(git merge-base origin/master HEAD)"
            head_sha="$GITHUB_SHA"
          fi

          if git diff --quiet "$base_sha" "$head_sha" -- \
            Dockerfile .dockerignore package.json bun.lock bunfig.toml \
            tsconfig.json uno.config.ts data scripts src; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Docker-relevant changes detected."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: steps.changes.outputs.run == 'true'
        run: docker build -t flashbang:pr-health .

      - name: Verify container health
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 127.0.0.1:3000:3000 flashbang:pr-health)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" || true' EXIT

          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$cid")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Container reported unhealthy status"
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for healthy container status"
          exit 1
