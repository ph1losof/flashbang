name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate release tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match strict stable SemVer vX.Y.Z." >&2
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          package_version="$(bun -e 'const p = await Bun.file("package.json").json(); if (typeof p.version !== "string") { console.error("package.json version must be a string"); process.exit(1); } process.stdout.write(p.version);')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Release tag version '$tag_version' does not match package.json version '$package_version'." >&2
            exit 1
          fi

      - name: Verify release ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin +master:refs/remotes/origin/master
          tagged_commit="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/master; then
            echo "::error::Tagged commit '$tagged_commit' is not contained in origin/master." >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run codegen -- --from-merged
      - run: bun run typecheck
      - run: bun run check
      - run: bun audit
      - run: bun test
      - run: bun run build

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        run: |
          set -euo pipefail
          if ! gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest; then
            echo "::error::Failed to create GitHub Release for '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  docker:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image for health gate
        run: docker build -t flashbang:release-health .

      - name: Verify container health
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 127.0.0.1:3000:3000 flashbang:release-health)"
          cleanup() {
            docker logs "$cid" || true
            docker rm -f "$cid" || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$cid")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Container reported unhealthy status"
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for healthy container status"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
