name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate release tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match strict stable SemVer vX.Y.Z." >&2
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          package_version="$(bun -e 'const p = await Bun.file("package.json").json(); if (typeof p.version !== "string") { console.error("package.json version must be a string"); process.exit(1); } process.stdout.write(p.version);')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Release tag version '$tag_version' does not match package.json version '$package_version'." >&2
            exit 1
          fi

      - name: Verify release ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin +master:refs/remotes/origin/master
          tagged_commit="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/master; then
            echo "::error::Tagged commit '$tagged_commit' is not contained in origin/master." >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run codegen -- --from-merged
      - run: bun run typecheck
      - run: bun run check
      - run: bun audit
      - run: bun test
      - run: bun run build

  docker:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image for health gate
        run: docker build -t flashbang:release-health .

      - name: Verify container health
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 127.0.0.1:3000:3000 flashbang:release-health)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" || true' EXIT

          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$cid")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Container reported unhealthy status"
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for healthy container status"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ steps.version.outputs.version }}
          push-to-registry: true

      - name: Sign and verify image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yaml@$GITHUB_REF" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST"

  release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        run: |
          set -euo pipefail
          if ! gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest; then
            echo "::error::Failed to create GitHub Release for '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
