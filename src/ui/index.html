<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <link
      rel="search"
      type="application/opensearchdescription+xml"
      title="flashbang"
      href="/opensearch.xml"
    >
    <style>
    html {
      background: #0a0a0f;
    }
    </style>
    <script>
    "use strict";
    (() => {
      const hasQuery =
        location.search.startsWith("?q=") || location.search.includes("&q=");
      const privateQuery = location.hash.startsWith("#q=")
        ? location.hash.substring(3).split("&", 1)[0]
        : null;
      const query =
        privateQuery ||
        (hasQuery && new URLSearchParams(location.search).get("q"));
      let workerRegistrationPromise = null;
      const registerWorker = () => {
        if (
          !("serviceWorker" in navigator) ||
          navigator.serviceWorker.controller
        ) {
          return null;
        }
        workerRegistrationPromise ||= navigator.serviceWorker
          .register("/sw.js")
          .catch(() => null);
        return workerRegistrationPromise;
      };

      const hotBangTriggers = new Set("__HOT_BANG_TRIGGERS_JSON__");
      const shouldPrefetchBangData = (value) => {
        let normalized = value;
        if (privateQuery !== null) {
          try {
            normalized = decodeURIComponent(value.replaceAll("+", " "));
          } catch {
            return false;
          }
        }
        const tokens = normalized.trim().toLowerCase().split(/\s+/);
        const markers = "!@$:;~";
        for (const token of [tokens[0], tokens.at(-1)]) {
          if (!token) {
            continue;
          }
          let trigger = null;
          if (markers.includes(token[0])) {
            trigger = token.substring(1);
          } else if (markers.includes(token.at(-1))) {
            trigger = token.substring(0, token.length - 1);
          }
          if (trigger && !hotBangTriggers.has(trigger)) {
            return true;
          }
        }
        return false;
      };

      const loadBangData = () =>
        fetch("__BANG_DATA_ASSET__").then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load bang data: ${response.status}`);
          }
          return response.arrayBuffer();
        });

      const seedWorker = async (data, settings, registrationPromise) => {
        const registration = await registrationPromise;
        const worker =
          registration?.installing ||
          registration?.waiting ||
          registration?.active;
        if (worker) {
          try {
            worker.postMessage(
              {
                type: "seed-runtime",
                asset: "__BANG_DATA_ASSET__",
                bangData: data,
                redirectSettings: settings,
              },
              [data]
            );
          } catch {
            // Handoff must never prevent the resolved navigation.
          }
        }
      };

      const showFallbackError = () => {
        document.body.textContent =
          "Flashbang could not resolve this query. Reload the page or enable Service Workers.";
      };

      const runRichFallback = (
        needsCatalog,
        prefetchedData,
        registrationPromise
      ) =>
        import("__FALLBACK_ASSET__")
          .then(async ({ resolveFallback, resolveHotFallback }) => {
            if (!needsCatalog) {
              const hot = await resolveHotFallback(
                query,
                privateQuery !== null
              );
              if (hot) {
                location.replace(hot.url);
                return;
              }
            }
            const data = await (prefetchedData || loadBangData());
            const { settings, url } = await resolveFallback(
              query,
              data,
              privateQuery !== null
            );
            await seedWorker(data, settings, registrationPromise);
            location.replace(url);
          })
          .catch(showFallbackError);

      let fallbackStarted = false;
      const fallback = () => {
        if (fallbackStarted) {
          return;
        }
        fallbackStarted = true;
        if (!query) {
          location.replace("/home");
          return;
        }
        const registrationPromise = registerWorker();
        const needsCatalog = shouldPrefetchBangData(query);
        if (!needsCatalog) {
          runRichFallback(false, null, registrationPromise);
          return;
        }
        import("__COLD_FALLBACK_ASSET__")
          .then(async ({ resolveColdFallback }) => {
            const result = await resolveColdFallback(
              query,
              undefined,
              privateQuery !== null
            );
            if (!result) {
              runRichFallback(true, loadBangData(), registrationPromise);
              return;
            }
            location.replace(result.url);
          })
          .catch(showFallbackError);
      };

      if (
        privateQuery &&
        "serviceWorker" in navigator &&
        navigator.serviceWorker.controller
      ) {
        const channel = new MessageChannel();
        channel.port1.onmessage = (event) => {
          if (typeof event.data === "string") {
            location.replace(event.data);
          }
        };
        navigator.serviceWorker.controller.postMessage(
          { type: "redirect", rawQuery: query },
          [channel.port2]
        );
      } else if (query) {
        fallback();
      } else if ("serviceWorker" in navigator) {
        registerWorker()?.catch(fallback);
        Promise.all([
          fetch("/opensearch.xml").catch(() => {
            // Pre-warm only; registration can continue without it.
          }),
          new Promise((resolve) => {
            if (navigator.serviceWorker.controller) {
              resolve();
            } else {
              navigator.serviceWorker.addEventListener(
                "controllerchange",
                resolve,
                { once: true }
              );
            }
          }),
        ]).then(() => {
          if (location.pathname === "/settings") {
            location.replace(location.href);
          } else {
            location.replace("/home");
          }
        });
      } else {
        fallback();
      }
    })();
    </script>
  </head>
  <body></body>
</html>
