<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <link
      rel="search"
      type="application/opensearchdescription+xml"
      title="flashbang"
      href="/opensearch.xml"
    >
    <style>
    html {
      background: #0a0a0f;
    }
    </style>
    <script>
    "use strict";
    (() => {
      const hasQuery =
        location.search.startsWith("?q=") || location.search.includes("&q=");
      const privateQuery = location.hash.startsWith("#q=")
        ? location.hash.substring(3).split("&", 1)[0]
        : null;
      const query =
        privateQuery ||
        (hasQuery && new URLSearchParams(location.search).get("q"));
      const workerRegistrationPromise =
        "serviceWorker" in navigator &&
        query &&
        !navigator.serviceWorker.controller
          ? navigator.serviceWorker.register("/sw.js").catch(() => null)
          : null;

      let fallbackStarted = false;
      const fallback = () => {
        if (fallbackStarted) {
          return;
        }
        fallbackStarted = true;
        if (!query) {
          location.replace("/home");
          return;
        }
        Promise.all([
          fetch("__BANG_DATA_ASSET__").then((response) => {
            if (!response.ok) {
              throw new Error(`Failed to load bang data: ${response.status}`);
            }
            return response.arrayBuffer();
          }),
          import("/fallback.js"),
        ])
          .then(async ([data, { resolveFallback }]) => {
            const { settings, url } = await resolveFallback(
              query,
              data,
              privateQuery !== null
            );
            const registration = workerRegistrationPromise
              ? await workerRegistrationPromise
              : null;
            const worker =
              registration?.installing ||
              registration?.waiting ||
              registration?.active;
            if (worker) {
              try {
                worker.postMessage(
                  {
                    type: "seed-runtime",
                    asset: "__BANG_DATA_ASSET__",
                    bangData: data,
                    redirectSettings: settings,
                  },
                  [data]
                );
              } catch {
                // Handoff must never prevent the resolved navigation.
              }
            }
            location.replace(url);
          })
          .catch(() => {
            document.body.textContent =
              "Flashbang could not resolve this query. Reload the page or enable Service Workers.";
          });
      };

      if (
        privateQuery &&
        "serviceWorker" in navigator &&
        navigator.serviceWorker.controller
      ) {
        const channel = new MessageChannel();
        channel.port1.onmessage = (event) => {
          if (typeof event.data === "string") {
            location.replace(event.data);
          }
        };
        navigator.serviceWorker.controller.postMessage(
          { type: "redirect", rawQuery: query },
          [channel.port2]
        );
      } else if (privateQuery) {
        fallback();
      } else if (query) {
        fallback();
      } else if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(fallback);
        Promise.all([
          fetch("/opensearch.xml").catch(() => {
            // Pre-warm only; registration can continue without it.
          }),
          new Promise((resolve) => {
            if (navigator.serviceWorker.controller) {
              resolve();
            } else {
              navigator.serviceWorker.addEventListener(
                "controllerchange",
                resolve,
                { once: true }
              );
            }
          }),
        ]).then(() => {
          if (location.pathname === "/settings") {
            location.replace(location.href);
          } else {
            location.replace("/home");
          }
        });
      } else {
        fallback();
      }
    })();
    </script>
  </head>
  <body></body>
</html>
